schemaVersion: 2.2.0
metadata:
  name: crush-ai-workspace
  version: 1.0.0
  description: OpenShift DevSpaces workspace running Crush AI coding TUI
  language: go
  tags:
    - ai
    - tui
    - crush

components:
  - name: crush
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
      memoryLimit: 2Gi
      memoryRequest: 512Mi
      cpuLimit: "1"
      cpuRequest: "0.25"
      mountSources: true
      sourceMapping: /projects
      env:
        # AI Provider API Keys
        # Override these via Kubernetes secrets in your DevSpaces namespace.
        # Create a secret with label controller.devfile.io/watch-secret: "true"
        # and these keys will be injected automatically.
        - name: ANTHROPIC_API_KEY
          value: ""
        - name: OPENAI_API_KEY
          value: ""
        - name: GEMINI_API_KEY
          value: ""
        - name: GROQ_API_KEY
          value: ""
        - name: OPENROUTER_API_KEY
          value: ""

        # Custom / Self-hosted model endpoint
        - name: CUSTOM_API_KEY
          value: ""
        - name: CUSTOM_API_ENDPOINT
          value: ""

        # Crush settings
        - name: CRUSH_DISABLE_METRICS
          value: "true"
        - name: TERM
          value: xterm-256color
        - name: SHELL
          value: /bin/bash

      volumeMounts:
        - name: crush-data
          path: /home/user/.local/share/crush

  - name: crush-data
    volume:
      size: 1Gi

commands:
  - id: install-crush
    exec:
      component: crush
      commandLine: >
        command -v crush >/dev/null 2>&1 && echo "Crush already installed" ||
        (echo "Adding Charm repo..." &&
        printf '[charm]\nname=Charm\nbaseurl=https://repo.charm.sh/yum/\nenabled=1\ngpgcheck=1\ngpgkey=https://repo.charm.sh/yum/gpg.key\n' > /etc/yum.repos.d/charm.repo &&
        dnf install -y --nodocs crush git-core &&
        dnf clean all &&
        echo "Crush installed successfully")
      workingDir: /
      group:
        kind: build
        isDefault: true

  - id: run-crush
    exec:
      component: crush
      commandLine: crush
      workingDir: /projects
      group:
        kind: run
        isDefault: true
